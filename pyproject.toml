[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knot-recognition"
version = "0.1.0"
description = "Knot recognition and Gauss/PD extraction from images."
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "abhyudaymishr"}]
keywords = ["knot theory", "topology", "computer vision", "image recognition"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
  "torch>=2.0.0",
  "torchvision>=0.15.0",
  "numpy>=1.22.0",
  "opencv-python>=4.6.0",
  "scikit-image>=0.19.0",
  "scipy>=1.9.0",
  "pandas>=1.5.0",
  "Pillow>=9.0.0",
  "tqdm>=4.64.0",
  "matplotlib>=3.5.0",
  "networkx>=2.8.0",
  "sympy>=1.11.0",
]

[project.optional-dependencies]
test = [
  "pytest>=7.0.0",
]
snappy = [
  "snappy>=3.0",
  "snappy_manifolds>=1.4",
]
research = [
  "scikit-learn>=1.3",
  "topoly==1.1.0",
]
all = [
  "pytest>=7.0.0",
  "snappy>=3.0",
  "snappy_manifolds>=1.4",
]

[project.urls]
Homepage = "https://github.com/abhyudaymishr/knot_recognition"
Source = "https://github.com/abhyudaymishr/knot_recognition"
Issues = "https://github.com/abhyudaymishr/knot_recognition/issues"

[project.scripts]
knot-recognition = "knot_recognition.infer:main"
knot = "knot_recognition.infer:main"
knot-moves = "knot_recognition.reidemeister:main"
knot-solve = "knot_recognition.solver:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
