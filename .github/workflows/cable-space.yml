name: Cable knot Space CI and deploy

on:
  push:
    branches: [main, master]
    paths:
      - "huggingface_space/**"
      - "src/knot_recognition/**"
      - "Knotgen/knotgen.py"
      - "Knotgen/census_braids.json"
      - ".github/workflows/cable-space.yml"
  pull_request:
    paths:
      - "huggingface_space/**"
      - "src/knot_recognition/**"
      - "Knotgen/knotgen.py"
      - "Knotgen/census_braids.json"
      - ".github/workflows/cable-space.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Bundle current engine sources into the Space package
        run: |
          cp src/knot_recognition/utils.py src/knot_recognition/preprocess.py src/knot_recognition/gauss_pd.py src/knot_recognition/traverser.py huggingface_space/runtime/knot_recognition/
          cp Knotgen/knotgen.py Knotgen/census_braids.json huggingface_space/runtime/Knotgen/
      - name: Install Space dependencies
        run: python -m pip install -r huggingface_space/requirements.txt
      - name: Validate Python syntax and runtime imports
        run: |
          python -m py_compile huggingface_space/app.py
          cd huggingface_space
          python -c "import app; print('Space app imports successfully')"
      - name: Deploy Space after main branch validation
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          HF_TOKEN: ${{ secrets.KNOTASSISTANT }}
          HF_SPACE_ID: AbhyudayMishr/KnotAssistant
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "Repository secret KNOTASSISTANT is missing or unavailable to this workflow."
            exit 1
          fi
          python -m pip install --upgrade huggingface_hub
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          api.upload_folder(
              repo_id=os.environ["HF_SPACE_ID"],
              repo_type="space",
              folder_path="huggingface_space",
              path_in_repo=".",
              commit_message="Deploy validated cable knot photo triage",
          )
          PY
